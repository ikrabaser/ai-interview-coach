<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mülakat Sorusu</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                radial-gradient(circle at top left,#233b8b 0%,#08122f 45%,#020617 100%);
            color:white;
            padding:40px;
        }

        .container{
            width:100%;
            max-width:1000px;
            background:rgba(8,15,40,0.85);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:32px;
            padding:50px;
            backdrop-filter:blur(14px);
            box-shadow:
                0 0 40px rgba(0,0,0,0.45),
                0 0 80px rgba(56,189,248,0.08);
        }

        .badge{
            display:inline-block;
            padding:10px 18px;
            border-radius:999px;
            border:1px solid rgba(56,189,248,0.4);
            background:rgba(56,189,248,0.08);
            color:#38bdf8;
            font-weight:bold;
            margin-bottom:28px;
        }

        h1{
            font-size:68px;
            margin-bottom:35px;
            font-weight:800;
        }

        h1 span{
            color:#38bdf8;
        }

        .question-box{
            background:#0a1435;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:24px;
            padding:38px;
            font-size:30px;
            line-height:1.6;
            margin-bottom:35px;
        }

        textarea{
            width:100%;
            min-height:280px;
            resize:none;
            border:none;
            outline:none;
            border-radius:24px;
            padding:35px;
            background:#09122e;
            color:white;
            font-size:24px;
            border:1px solid rgba(255,255,255,0.08);
            margin-bottom:30px;
        }

        textarea::placeholder{
            color:#7c8aa5;
        }

        button{
            width:100%;
            padding:24px;
            border:none;
            border-radius:20px;
            background:#38bdf8;
            color:black;
            font-size:24px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 0 25px rgba(56,189,248,0.4);
        }

        .back-link{
            display:inline-block;
            margin-top:28px;
            color:#94a3b8;
            text-decoration:none;
            font-size:20px;
        }

        .back-link:hover{
            color:#38bdf8;
        }

        #loadingText{
            display:none;
            text-align:center;
            margin-top:20px;
            color:#38bdf8;
            font-size:20px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="badge">
        Technical Interview Question
    </div>

    <h1>
        Mülakat <span>Sorusu</span>
    </h1>

    <div class="question-box">
        [[${question}]]
    </div>

    <form id="answerForm" action="/analyze" method="post">

        <input type="hidden" name="question" th:value="${question}">
        <input type="hidden" name="category" th:value="${category}">

        <textarea
                name="answer"
                placeholder="Cevabınızı burada yazınız..."
                required>
        </textarea>

        <button id="analyzeButton" type="submit">
            Cevabı Analiz Et
        </button>

        <p id="loadingText">
            AI cevabı analiz ediyor...
        </p>

    </form>

    <a href="/" class="back-link">
        ← Ana sayfaya dön
    </a>

</div>

<script>

    const form = document.getElementById("answerForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const button = document.getElementById("analyzeButton");
        const loadingText = document.getElementById("loadingText");

        button.innerText = "Analiz Ediliyor...";
        button.disabled = true;
        button.style.opacity = "0.7";
        button.style.cursor = "not-allowed";

        loadingText.style.display = "block";

        setTimeout(function() {
            form.submit();
        }, 1500);

    });

</script>

</body>
</html>
