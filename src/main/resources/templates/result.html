<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Analiz Sonucu</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:'Segoe UI',sans-serif;
            background:radial-gradient(circle at top left,#1e3a8a,#020617 60%);
            color:white;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:900px;
            background:rgba(15,23,42,0.78);
            border:1px solid rgba(255,255,255,0.08);
            padding:45px;
            border-radius:28px;
            text-align:center;
        }

        .badge{
            display:inline-block;
            padding:8px 14px;
            border-radius:999px;
            background:rgba(56,189,248,0.12);
            color:#38bdf8;
            font-size:13px;
            font-weight:600;
            margin-bottom:18px;
            border:1px solid rgba(56,189,248,0.25);
        }

        h1{
            font-size:52px;
            color:#f8fafc;
            margin-bottom:10px;
        }

        h1 span{
            color:#38bdf8;
        }

        .score{
            font-size:90px;
            font-weight:800;
            color:#38bdf8;
            margin:20px 0;
        }

        .metrics{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:16px;
            margin-bottom:24px;
        }

        .metric-card{
            background:#0f172a;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:18px;
            padding:22px;
        }

        .metric-card h3{
            color:#94a3b8;
            font-size:15px;
            margin-bottom:12px;
        }

        .metric-card p{
            color:#38bdf8;
            font-size:32px;
            font-weight:800;
            margin:0;
        }

        .box{
            background:#0f172a;
            border:1px solid rgba(255,255,255,0.08);
            padding:24px;
            border-radius:18px;
            margin-top:18px;
            text-align:left;
        }

        .box h3{
            color:#f8fafc;
            margin-bottom:14px;
        }

        .box p{
            color:#cbd5e1;
            font-size:17px;
            line-height:1.7;
            margin:0;
        }

        .actions{
            display:flex;
            gap:14px;
            margin-top:28px;
        }

        .btn{
            flex:1;
            padding:16px;
            border-radius:14px;
            font-weight:700;
            text-decoration:none;
            text-align:center;
            font-size:16px;
            border:none;
            cursor:pointer;
            transition:0.25s;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .primary{
            background:#38bdf8;
            color:#020617;
        }

        .secondary{
            background:#0f172a;
            color:#94a3b8;
            border:1px solid rgba(255,255,255,0.08);
        }

    </style>
</head>

<body>

<div class="container">

    <div class="badge">AI Evaluation Result</div>

    <h1>Analiz <span>Sonucu</span></h1>

    <div class="score" th:text="${score} + '%'"></div>

    <div class="metrics">

        <div class="metric-card">
            <h3>Kavram Başarısı</h3>
            <p th:text="${keywordSuccess} + '%'"></p>
        </div>

        <div class="metric-card">
            <h3>Cevap Uzunluğu</h3>
            <p th:text="${lengthSuccess} + '%'"></p>
        </div>

        <div class="metric-card">
            <h3>Açıklama Kalitesi</h3>
            <p th:text="${explanationSuccess} + '%'"></p>
        </div>

        <div class="metric-card">
            <h3>Kelime Sayısı</h3>
            <p th:text="${wordCount}"></p>
        </div>

    </div>

    <div class="box">
        <h3>Eksik Kavramlar</h3>
        <p th:text="${#lists.isEmpty(missingKeywords) ? 'Eksik kavram bulunamadı.' : missingKeywords}"></p>
    </div>

    <div class="box">
        <h3>AI Geri Bildirimi</h3>
        <p th:text="${feedback}"></p>
    </div>

    <div class="box">
        <h3>Önerilen Cevap</h3>
        <p th:text="${suggestedAnswer}"></p>
    </div>

    <div class="actions">

        <a class="btn secondary" href="/">
            Ana Sayfa
        </a>

        <form action="/question" method="post" style="flex:1;">
            <input type="hidden" name="category" th:value="${category}">
            <button class="btn primary" type="submit" style="width:100%;">
                Yeni Soru
            </button>
        </form>

        <form action="/question" method="post" style="flex:1;">
            <input type="hidden" name="category" th:value="${category}">
            <button class="btn secondary" type="submit" style="width:100%;">
                Aynı Kategoriyi Tekrar Çöz
            </button>
        </form>

    </div>

</div>

</body>
</html>
