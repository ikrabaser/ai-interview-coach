<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Interview Coach</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:'Segoe UI',sans-serif;
            background:radial-gradient(circle at top left,#1e3a8a,#020617 60%);
            color:white;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        .container{
            width:420px;
            background:rgba(15,23,42,0.75);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.08);
            padding:45px;
            border-radius:28px;
            box-shadow:
                0 0 50px rgba(56,189,248,0.08),
                0 20px 40px rgba(0,0,0,0.45);
            text-align:center;
        }

        .badge{
            display:inline-block;
            padding:8px 14px;
            border-radius:999px;
            background:rgba(56,189,248,0.12);
            color:#38bdf8;
            font-size:13px;
            font-weight:600;
            margin-bottom:18px;
            border:1px solid rgba(56,189,248,0.25);
        }

        h1{
            margin:0 0 14px;
            font-size:42px;
            font-weight:700;
            color:#f8fafc;
            letter-spacing:-1px;
        }

        h1 span{
            color:#38bdf8;
        }

        p{
            color:#94a3b8;
            line-height:1.6;
            margin-bottom:30px;
            font-size:15px;
        }

        select{
            width:100%;
            padding:15px;
            border-radius:14px;
            border:1px solid rgba(255,255,255,0.08);
            background:#0f172a;
            color:white;
            font-size:15px;
            outline:none;
        }

        button{
            width:100%;
            padding:15px;
            margin-top:22px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#38bdf8,#0ea5e9);
            color:#020617;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(56,189,248,0.35);
        }

        .footer-text{
            margin-top:24px;
            font-size:12px;
            color:#64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="badge">AI Powered Interview Practice</div>

    <h1>AI Interview <span>Coach</span></h1>

    <p>
        Teknik mülakatlara hazırlanmak için alan seç,
        sistem sana soru yöneltsin ve cevabını analiz etsin.
    </p>

    <form action="/question" method="post">

        <select name="category">
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="ai">Yapay Zeka</option>
            <option value="cyber">Siber Güvenlik</option>
        </select>

        <button type="submit">
            Mülakata Başla
        </button>

    </form>

    <div class="footer-text">
        Java Spring Boot ile geliştirildi
    </div>

</div>

</body>
</html>
